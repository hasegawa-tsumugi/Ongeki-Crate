name: fluid_glass
description: Liquid Glass backdrop effects for Flutter, with refraction, chromatic dispersion, blur, highlights and continuous-corner shapes.
version: 0.6.1
repository: https://github.com/TIANLI0/FluidGlass

# Vendored copy — see PATCHES.md in this directory. Upstream's `screenshots:`
# block is dropped along with `doc/`: it is pub.dev listing metadata, and the
# analyser reports every missing webp under it as a warning.

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  cupertino_ui: ^1.1.7
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/refraction.frag
    - shaders/refraction_dispersion.frag
    - shaders/highlight_default.frag
    - shaders/highlight_ambient.frag
    - shaders/interactive_highlight.frag
    - shaders/fusion.frag
    - shaders/progressive_blur.frag
    - shaders/soft_spot_light.frag
    - shaders/soft_bloom_stroke.frag
    - shaders/soft_meta_ball.frag
    - shaders/soft_caustic.frag
    - shaders/soft_blend_tint.frag
    - shaders/soft_capsule_edge.frag
    - shaders/soft_meta_ball_edge.frag
