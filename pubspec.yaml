name: songquery_flutter
description: Ongeki song query app rewritten in Flutter.
publish_to: none
version: 0.1.2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  # 直接用它的 DefaultCacheManager 做曲绘预取 —— 与 cached_network_image
  # 共用同一份磁盘缓存，所以这里必须显式声明，别靠传递依赖。
  flutter_cache_manager: ^3.4.1
  url_launcher: ^6.3.2
  crypto: ^3.0.6
  fluid_glass: ^0.6.1
  material_ui: ^1.11.1

# 底栏的模糊半径上游没开放参数，只有 `third_party/fluid_glass` 里改过的
# 那份（面板 8 → 2，见该目录 PATCHES.md）。这里用 path 覆盖住，避免
# `pub get` 把它换回原版 —— 换回去就是「tab 比右侧按钮更糊」。
dependency_overrides:
  fluid_glass:
    path: third_party/fluid_glass

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 只在测试里用（retryDelay 等待要靠 fakeAsync 推进时钟）。
  # flutter_test 已传递依赖它，这里显式声明只为消掉 depend_on_referenced_packages。
  fake_async: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/tex/bg_mesh.webp
    - assets/tex/bg_circuit.webp
    - assets/fonts/LICENSE-MPLUS1p.txt
    - assets/songs-2026.10.15.json
    # 许可文本随包分发（OFL 要求许可随字体走；MiSans 要求注明使用）。
    - assets/fonts/LICENSE-JosefinSans.txt
    - assets/fonts/THIRD-PARTY-NOTICES.txt
  # 液态玻璃的 shader 不再由本项目提供：底栏改用 `fluid_glass`
  # （Kyant0/AndroidLiquidGlass 的 Flutter 移植），它的 refraction /
  # highlight / interactive_highlight 等 .frag 由该包自己声明并打进包。
  fonts:
    - family: Official
      fonts:
        - asset: assets/fonts/JosefinSans-Bold.ttf
          weight: 700
    - family: MPLUS1p
      fonts:
        - asset: assets/fonts/MPLUS1p-Medium.ttf
          weight: 500
        - asset: assets/fonts/MPLUS1p-Bold.ttf
          weight: 700
    - family: SEGA
      fonts:
        - asset: assets/fonts/SEGA_MaruGothicDB_traced.ttf
    - family: Josefin
      fonts:
        - asset: assets/fonts/JosefinSans-Bold.ttf
          weight: 700
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Medium.ttf
